name: Build and publish

on:
  schedule:
    - cron: "17 */6 * * *"   # look for a new ComfyUI release or a change to a bundled node
  workflow_dispatch:
    inputs:
      version:
        description: "ComfyUI version to build (e.g. 0.38.0); empty = latest release"
        required: false
        default: ""
      force:
        description: "Rebuild even if the image tag already exists"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - Dockerfile
      - scripts/**
      - .github/workflows/release.yml

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      packages: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      ref: ${{ steps.v.outputs.ref }}
      build: ${{ steps.v.outputs.build }}
      is_latest: ${{ steps.v.outputs.is_latest }}
      agent_sha: ${{ steps.v.outputs.agent_sha }}
      vhs_sha: ${{ steps.v.outputs.vhs_sha }}
      sage_sha: ${{ steps.v.outputs.sage_sha }}
      bundle_id: ${{ steps.v.outputs.bundle_id }}
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.version }}
          FORCE: ${{ inputs.force }}
        run: |
          latest_tag=$(gh api repos/Comfy-Org/ComfyUI/releases/latest --jq .tag_name)
          latest="${latest_tag#v}"
          if [ -n "$REQUESTED" ]; then
            version="${REQUESTED#v}"
          else
            version="$latest"
          fi

          # Latest commit touching the bundled nodes; a change here triggers a rebuild.
          agent_sha=$(gh api "repos/romkey/comfier-ui/commits?path=comfyui/comfier_agent&per_page=1" --jq '.[0].sha')
          vhs_sha=$(gh api "repos/Kosinkadink/ComfyUI-VideoHelperSuite/commits?per_page=1" --jq '.[0].sha')
          sage_sha=$(gh api "repos/thu-ml/SageAttention/commits?per_page=1" --jq '.[0].sha')
          bundle_id="agent-${agent_sha:0:12}_vhs-${vhs_sha:0:12}_sage-${sage_sha:0:12}"

          build=false
          if [ "$FORCE" = "true" ] || [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            build=true
          elif ! info=$(docker buildx imagetools inspect "$IMAGE:$version" --format '{{json .}}' 2>/dev/null); then
            build=true
          else
            published=$(jq -r '.image["linux/amd64"].config.Labels["comfyui-docker.bundle-id"] // ""' <<<"$info")
            if [ "$published" != "$bundle_id" ]; then
              echo "Bundled nodes changed: '$published' -> '$bundle_id'"
              build=true
            fi
          fi
          {
            echo "agent_sha=$agent_sha"
            echo "vhs_sha=$vhs_sha"
            echo "sage_sha=$sage_sha"
            echo "bundle_id=$bundle_id"
            echo "version=$version"
            echo "ref=v$version"
            echo "build=$build"
            echo "is_latest=$([ "$version" = "$latest" ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"
          echo "ComfyUI $version (latest=$latest) build=$build"

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        variant: [cu130, cu128, cpu, sage, rocm-gfx1151, xpu]
        arch: [amd64, arm64]
        include:
          - { variant: cu130, index: "https://download.pytorch.org/whl/cu130", flavor: plain }
          - { variant: cu128, index: "https://download.pytorch.org/whl/cu128", flavor: plain }
          - { variant: cpu, index: "https://download.pytorch.org/whl/cpu", flavor: plain }
          - { variant: sage, index: "https://download.pytorch.org/whl/cu130", flavor: sage }
          - { variant: rocm-gfx1151, index: "https://repo.amd.com/rocm/whl/gfx1151/", flavor: rocm }
          - variant: xpu
            index: "https://download.pytorch.org/whl/xpu"
            flavor: xpu
            base: python:3.12-slim-trixie
          - { arch: amd64, runner: ubuntu-26.04 }
          - { arch: arm64, runner: ubuntu-26.04-arm }
        exclude:
          # AMD Strix Halo is x86_64 only.
          - { variant: rocm-gfx1151, arch: arm64 }
          # Intel's GPU driver and the xpu PyTorch wheels are x86_64 only.
          - { variant: xpu, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: |
            TORCH_INDEX_URL=${{ matrix.index }}
            FLAVOR=${{ matrix.flavor }}
            BASE_IMAGE=${{ matrix.base || 'python:3.12-slim-bookworm' }}
            SAGE_REF=${{ needs.check.outputs.sage_sha }}
            COMFYUI_REF=${{ needs.check.outputs.ref }}
            COMFIER_AGENT_REF=${{ needs.check.outputs.agent_sha }}
            VHS_REF=${{ needs.check.outputs.vhs_sha }}
            BUNDLE_ID=${{ needs.check.outputs.bundle_id }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}-${{ matrix.arch }}
      - name: Export digest
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.variant }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    # One variant failing to build must not stop the others from being published.
    needs: [check, build]
    if: ${{ !cancelled() && needs.check.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant:
          - { name: cu130, suffix: "" }
          - { name: cu128, suffix: "-cu128" }
          - { name: cpu, suffix: "-cpu" }
          - { name: sage, suffix: "-sage" }
          - { name: rocm-gfx1151, suffix: "-rocm-gfx1151" }
          - { name: xpu, suffix: "-xpu" }
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digests-${{ matrix.variant.name }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-arch manifests
        env:
          VERSION: ${{ needs.check.outputs.version }}
          IS_LATEST: ${{ needs.check.outputs.is_latest }}
          SUFFIX: ${{ matrix.variant.suffix }}
        working-directory: ${{ runner.temp }}/digests
        run: |
          tags=(-t "$IMAGE:${VERSION}${SUFFIX}")
          if [ "$IS_LATEST" = "true" ]; then
            tags+=(-t "$IMAGE:latest${SUFFIX}")
          fi
          # shellcheck disable=SC2046
          docker buildx imagetools create "${tags[@]}" $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:${VERSION}${SUFFIX}"

  release:
    # Record each published version as a GitHub release; feeds the version badge in the README.
    needs: [check, merge]
    if: ${{ !cancelled() && needs.check.outputs.build == 'true' && needs.check.outputs.is_latest == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          # Only record a release if the main image was actually published.
          if ! docker buildx imagetools inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "Image $IMAGE:$VERSION is not published; skipping release"
            exit 0
          fi
          if ! gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "ComfyUI $VERSION" \
              --notes "Docker image for [ComfyUI $VERSION](https://github.com/Comfy-Org/ComfyUI/releases/tag/v$VERSION): \`docker pull ghcr.io/$GITHUB_REPOSITORY:$VERSION\`"
          fi
