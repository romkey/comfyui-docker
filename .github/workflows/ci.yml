name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./scripts
      - name: yamllint
        run: pipx run yamllint -c .yamllint.yaml .
      - name: actionlint
        uses: raven-actions/actionlint@v2
      - name: Validate compose files
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.cpu.yml config -q

  build:
    # Smoke test: the CPU variant builds and the entrypoint boots ComfyUI.
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (cpu)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: comfyui-ci:cpu
          build-args: TORCH_INDEX_URL=https://download.pytorch.org/whl/cpu
          cache-from: type=gha,scope=ci-cpu
          cache-to: type=gha,mode=max,scope=ci-cpu
      - name: Smoke test
        run: |
          docker run -d --name comfy -e COMFYUI_CPU=true -p 8188:8188 comfyui-ci:cpu
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8188/system_stats >/dev/null; then
              echo "ComfyUI is up"; exit 0
            fi
            sleep 5
          done
          docker logs comfy
          exit 1
